<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Grimoire — Blood on the Clocktower Chronicle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0d0a12;
    --night-2: #16111f;
    --parchment: #e8dcc0;
    --parchment-dim: #b3a688;
    --blood: #8e1c1c;
    --blood-bright: #c0392b;
    --good: #3d6b9e;
    --good-bright: #6fa3d8;
    --evil: #a02020;
    --evil-bright: #e05252;
    --gold: #c9a227;
    --ink: #2a2436;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--night);
    color: var(--parchment);
    font-family: 'IM Fell English', serif;
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 50% -10%, #2a1f3d 0%, transparent 55%),
      radial-gradient(ellipse at 85% 15%, rgba(142,28,28,0.12) 0%, transparent 45%);
    background-attachment: fixed;
  }

  /* ---- Stars ---- */
  .stars {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
  }
  .stars span {
    position: absolute; background: #fff; border-radius: 50%;
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 0.8; }
  }

  main { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding: 0 24px 80px; }

  /* ---- Header ---- */
  header { text-align: center; padding: 48px 0 12px; }

  .tower { width: 130px; height: 170px; margin: 0 auto; display: block; }

  h1 {
    font-family: 'Cinzel Decorative', serif;
    font-weight: 900;
    font-size: clamp(1.8rem, 5vw, 3.2rem);
    letter-spacing: 0.06em;
    margin-top: 10px;
    color: var(--parchment);
    text-shadow: 0 0 30px rgba(192, 57, 43, 0.35), 0 2px 4px #000;
  }
  h1 .blood-word { color: var(--blood-bright); }

  .subtitle {
    font-family: 'IM Fell English SC', serif;
    font-size: 1.15rem;
    color: var(--parchment-dim);
    font-style: italic;
    margin-top: 6px;
    letter-spacing: 0.12em;
  }

  .flourish {
    display: flex; align-items: center; justify-content: center;
    gap: 14px; margin: 22px 0; color: var(--gold); opacity: 0.7;
  }
  .flourish::before, .flourish::after {
    content: ''; height: 1px; width: min(180px, 24vw);
    background: linear-gradient(90deg, transparent, var(--gold));
  }
  .flourish::after { background: linear-gradient(90deg, var(--gold), transparent); }

  /* ---- Tally ---- */
  .tally {
    display: flex; justify-content: center; gap: 16px; flex-wrap: wrap;
    margin: 8px 0 40px;
  }
  .tally-stone {
    background: linear-gradient(180deg, var(--night-2), #100c17);
    border: 1px solid #3a3050;
    border-radius: 10px;
    padding: 14px 26px;
    text-align: center;
    min-width: 130px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.5), inset 0 1px 0 rgba(232,220,192,0.06);
  }
  .tally-stone .num {
    font-family: 'Cinzel Decorative', serif;
    font-weight: 700; font-size: 2rem; line-height: 1.1;
  }
  .tally-stone .label {
    font-family: 'IM Fell English SC', serif;
    font-size: 0.85rem; color: var(--parchment-dim); letter-spacing: 0.14em;
  }
  .tally-stone.good .num { color: var(--good-bright); text-shadow: 0 0 14px rgba(111,163,216,0.4); }
  .tally-stone.evil .num { color: var(--evil-bright); text-shadow: 0 0 14px rgba(224,82,82,0.4); }
  .tally-stone.total .num { color: var(--gold); text-shadow: 0 0 14px rgba(201,162,39,0.35); }

  /* ---- Filters ---- */
  .filters {
    display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
    margin-bottom: 34px;
  }
  .filters button {
    font-family: 'IM Fell English SC', serif;
    font-size: 0.95rem;
    letter-spacing: 0.08em;
    background: transparent;
    color: var(--parchment-dim);
    border: 1px solid #3a3050;
    border-radius: 999px;
    padding: 7px 18px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .filters button:hover { color: var(--parchment); border-color: var(--gold); }
  .filters button.active {
    color: var(--gold); border-color: var(--gold);
    background: rgba(201,162,39,0.08);
    box-shadow: 0 0 12px rgba(201,162,39,0.15);
  }

  /* ---- Session date banner ---- */
  .session-date {
    display: flex; align-items: center; gap: 16px;
    margin: 40px 0 22px;
    font-family: 'IM Fell English SC', serif;
    font-size: 1.25rem;
    color: var(--gold);
    letter-spacing: 0.15em;
  }
  .session-date::before, .session-date::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,162,39,0.5), transparent);
  }

  /* ---- Game cards ---- */
  .game-card {
    position: relative;
    background: linear-gradient(180deg, #1a1424 0%, #130e1c 100%);
    border: 1px solid #352b4a;
    border-radius: 12px;
    padding: 26px 30px 24px;
    margin-bottom: 26px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.55), inset 0 1px 0 rgba(232,220,192,0.05);
    overflow: hidden;
  }
  .game-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
  }
  .game-card.good-won::before { background: linear-gradient(90deg, transparent, var(--good-bright), transparent); }
  .game-card.evil-won::before { background: linear-gradient(90deg, transparent, var(--evil-bright), transparent); }

  .game-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; flex-wrap: wrap; margin-bottom: 4px;
  }
  .game-number {
    font-family: 'Cinzel Decorative', serif;
    font-weight: 700;
    font-size: 1.35rem;
    color: var(--parchment);
  }
  .game-number .numeral { color: var(--gold); }

  .script-name {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--parchment-dim);
    margin-bottom: 16px;
  }
  .script-name::before { content: '📜 '; font-style: normal; opacity: 0.8; }

  .verdict {
    font-family: 'IM Fell English SC', serif;
    font-size: 1rem;
    letter-spacing: 0.1em;
    padding: 5px 16px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .verdict.good {
    color: var(--good-bright);
    border: 1px solid rgba(111,163,216,0.5);
    background: rgba(61,107,158,0.12);
    text-shadow: 0 0 10px rgba(111,163,216,0.5);
  }
  .verdict.evil {
    color: var(--evil-bright);
    border: 1px solid rgba(224,82,82,0.5);
    background: rgba(160,32,32,0.12);
    text-shadow: 0 0 10px rgba(224,82,82,0.5);
  }

  .twists-title {
    font-family: 'IM Fell English SC', serif;
    font-size: 0.92rem;
    color: var(--gold);
    letter-spacing: 0.18em;
    margin-bottom: 8px;
    opacity: 0.9;
  }
  .twists { list-style: none; }
  .twists li {
    position: relative;
    padding-left: 26px;
    margin-bottom: 9px;
    line-height: 1.55;
    font-size: 1.04rem;
    color: var(--parchment);
  }
  .twists li::before {
    content: '🗡';
    position: absolute; left: 0; top: 1px;
    font-size: 0.85rem;
    filter: hue-rotate(-30deg) saturate(2);
    opacity: 0.75;
  }
  .twists li em { color: var(--parchment-dim); }

  footer {
    text-align: center;
    margin-top: 60px;
    font-family: 'IM Fell English SC', serif;
    font-style: italic;
    color: var(--parchment-dim);
    opacity: 0.7;
    letter-spacing: 0.1em;
    line-height: 1.8;
  }

  @media (max-width: 560px) {
    .game-card { padding: 20px 18px; }
    .tally-stone { min-width: 100px; padding: 10px 16px; }
    .tally-stone .num { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<main>
  <header>
    <svg class="tower" viewBox="0 0 120 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <!-- moon -->
      <circle cx="97" cy="26" r="15" fill="#e8dcc0" opacity="0.9"/>
      <circle cx="103" cy="21" r="13" fill="#0d0a12"/>
      <!-- tower body -->
      <rect x="42" y="52" width="36" height="96" fill="#1e1729" stroke="#3a3050" stroke-width="1.5"/>
      <!-- roof -->
      <path d="M 36 52 L 60 18 L 84 52 Z" fill="#241b33" stroke="#3a3050" stroke-width="1.5"/>
      <line x1="60" y1="18" x2="60" y2="8" stroke="#3a3050" stroke-width="2"/>
      <circle cx="60" cy="7" r="2.5" fill="#c9a227"/>
      <!-- clock face -->
      <circle cx="60" cy="76" r="15" fill="#0d0a12" stroke="#c9a227" stroke-width="2"/>
      <circle cx="60" cy="76" r="1.8" fill="#c9a227"/>
      <!-- clock hands at witching hour-ish -->
      <line x1="60" y1="76" x2="60" y2="65" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/>
      <line x1="60" y1="76" x2="68" y2="80" stroke="#c9a227" stroke-width="1.6" stroke-linecap="round"/>
      <!-- tick marks -->
      <line x1="60" y1="62.5" x2="60" y2="65" stroke="#c9a227" stroke-width="1"/>
      <line x1="60" y1="87" x2="60" y2="89.5" stroke="#c9a227" stroke-width="1"/>
      <line x1="46.5" y1="76" x2="49" y2="76" stroke="#c9a227" stroke-width="1"/>
      <line x1="71" y1="76" x2="73.5" y2="76" stroke="#c9a227" stroke-width="1"/>
      <!-- window -->
      <path d="M 55 106 h 10 v 14 a 5 5 0 0 1 -10 0 Z" transform="rotate(180 60 113)" fill="#c9a227" opacity="0.55"/>
      <!-- blood drip from window -->
      <path d="M 60 120 q 1.5 6 0 12 q -1.5 -6 0 -12" fill="#8e1c1c"/>
      <!-- ground -->
      <path d="M 20 148 Q 60 142 100 148 L 100 152 L 20 152 Z" fill="#1a1424"/>
    </svg>
    <h1><span class="blood-word">Blood</span> on the Clocktower</h1>
  </header>

  <div class="flourish">☙ ❧</div>

  <div class="tally" id="tally"></div>

  <div class="filters" id="filters"></div>

  <div id="chronicle"></div>

  <footer>
    <p>“The tales herein are true, though the townsfolk who told them rarely were.”</p>
    <p>Recorded faithfully by the Storyteller's quill.</p>
  </footer>
</main>

<script>
/* ═══════════════════════════════════════════════════════════════
   THE LEDGER — add new games here.
   side: "good" or "evil" (who won)
   ═══════════════════════════════════════════════════════════════ */
const GAMES = [
  {
    date: "2026-07-08",
    game: 1,
    script: "Opium Den",
    winner: "good",
    twists: [
      "Both the real and the fake Balloonist had info that kinda matched.",
      "Both twin Chef infos were wrong because of the No Dashii.",
    ],
  },
  {
    date: "2026-07-08",
    game: 2,
    script: "Sects & Violets",
    winner: "good",
    twists: [
      "Artist, Flower Girl, and Dreamer info narrowed the demon down to one person on day 2.",
    ],
  },
  {
    date: "2026-07-08",
    game: 3,
    script: "Opium Den",
    winner: "good",
    twists: [
      "The Poppy Grower stayed alive the whole game.",
      "The demon was a Fang Gu — it jumped and died to the Witch.",
    ],
  },
  {
    date: "2026-07-04",
    game: 6,
    script: "Trouble Brewing",
    winner: "good",
    twists: [
      "Ryan was the drunk, poisoned, red-herring Investigator who saw Andrew the Ravenkeeper and Jenny the Saint as the Scarlet Woman.",
      "Cam sunk a kill day one to convince town of his Monk bluff — town was further convinced when he hit the Soldier night 2 and seemed to have protected twice in a row.",
    ],
  },
  {
    date: "2026-07-01",
    game: 1,
    script: "Watch Your Mouth V1",
    winner: "evil",
    twists: [
      "Claire told a story about getting into a car accident at Bay to Breakers / Pride — and Michael got mez-turned by asking how it was possible to mix up two events that were months apart.",
      "Lucy got a sober Empath “2” and never once considered it could be real.",
    ],
  },
  {
    date: "2026-07-01",
    game: 2,
    script: "Watch Your Mouth V1",
    winner: "good",
    twists: [
      "Anastasia was executed because everyone was convinced she was the innocent leech-host Pacifist — when in fact she was the starting Legion.",
      "Stephen was mez/legion-turned by convincing Lucy there was no Pixel clamshell foldable.",
    ],
  },
  {
    date: "2026-07-01",
    game: 3,
    script: "A Leech of Distrust v2.1",
    winner: "good",
    twists: [
      "Jenny told Lucy she was the Marionette, but Lucy assumed Abhi was the Devil's Advocate because he was triple-claiming Exorcist with Ryan and Jenny.",
    ],
  },
  {
    date: "2026-07-01",
    game: 4,
    script: "A Leech of Distrust v2.1",
    winner: "good",
    twists: [
      "Ryan slayed Michael, the leech host, on day one.",
    ],
  },
  {
    date: "2026-07-01",
    game: 5,
    script: "A Leech of Distrust v2.1",
    winner: "good",
    twists: [
      "Michael cold-called that he was the leech host — based purely on vibes. He was right.",
    ],
  },
  {
    date: "2026-07-01",
    game: 6,
    script: "A Leech of Distrust v2.1",
    winner: "good",
    twists: [
      "Ryan told Abhi he was the Marionette, but Michael convinced Abhi he was being played. The leech host was executed and evil fell.",
    ],
  },
];

/* ═══════════ rendering ═══════════ */

const ROMAN = n => {
  const map = [[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
  let out = '';
  for (const [v, s] of map) while (n >= v) { out += s; n -= v; }
  return out;
};

const prettyDate = iso => new Date(iso + 'T12:00:00').toLocaleDateString('en-US', {
  year: 'numeric', month: 'long', day: 'numeric'
});

function renderTally(games) {
  const good = games.filter(g => g.winner === 'good').length;
  const evil = games.filter(g => g.winner === 'evil').length;
  document.getElementById('tally').innerHTML = `
    <div class="tally-stone total"><div class="num">${games.length}</div><div class="label">Games Told</div></div>
    <div class="tally-stone good"><div class="num">${good}</div><div class="label">Good Triumphs</div></div>
    <div class="tally-stone evil"><div class="num">${evil}</div><div class="label">Evil Triumphs</div></div>
  `;
}

function renderFilters(games, active) {
  const scripts = [...new Set(games.map(g => g.script))];
  const el = document.getElementById('filters');
  el.innerHTML = ['All Scripts', ...scripts].map(s =>
    `<button class="${s === active ? 'active' : ''}" data-script="${s}">${s}</button>`
  ).join('');
  el.querySelectorAll('button').forEach(btn =>
    btn.addEventListener('click', () => render(btn.dataset.script))
  );
}

function renderChronicle(games) {
  const byDate = {};
  for (const g of games) (byDate[g.date] ||= []).push(g);
  const dates = Object.keys(byDate).sort((a, b) => b.localeCompare(a)); // newest first

  document.getElementById('chronicle').innerHTML = dates.map(date => `
    <div class="session-date">🕯 ${prettyDate(date)} 🕯</div>
    ${byDate[date].sort((a, b) => a.game - b.game).map(g => `
      <article class="game-card ${g.winner}-won">
        <div class="game-head">
          <span class="game-number">Game <span class="numeral">${ROMAN(g.game)}</span></span>
          <span class="verdict ${g.winner}">${g.winner === 'good' ? '☀ Good Prevailed' : '☾ Evil Prevailed'}</span>
        </div>
        <p class="script-name">${g.script}</p>
        <p class="twists-title">Twists of Fate</p>
        <ul class="twists">${g.twists.map(t => `<li>${t}</li>`).join('')}</ul>
      </article>
    `).join('')}
  `).join('');
}

function render(activeFilter = 'All Scripts') {
  const filtered = activeFilter === 'All Scripts'
    ? GAMES
    : GAMES.filter(g => g.script === activeFilter);
  renderTally(filtered);
  renderFilters(GAMES, activeFilter);
  renderChronicle(filtered);
}

/* twinkling stars */
(function makeStars() {
  const holder = document.getElementById('stars');
  for (let i = 0; i < 70; i++) {
    const s = document.createElement('span');
    const size = Math.random() * 2 + 0.5;
    s.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 100}%;` +
      `width:${size}px;height:${size}px;animation-delay:${Math.random() * 4}s;` +
      `animation-duration:${3 + Math.random() * 4}s;`;
    holder.appendChild(s);
  }
})();

render();
</script>
</body>
</html>
